name: Build DS17 R6 VIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi python3-pip >/dev/null
          pip3 install -q qmk || pip3 install -q --break-system-packages qmk

      - name: Build
        run: qmk compile -kb czmao/ds17/r6 -km via -e COLOR=false

      - name: Collect
        run: |
          mkdir -p out
          cp -v .build/*.bin out/
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ds17-r6-via
          path: out/
          if-no-files-found: error
