name: Build DS17 R6 VIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin ChibiOS to 21.11
        run: |
          git -C lib/chibios fetch --depth 1 origin 11edb1610980f213b9f83161e1715a46fb7e4c51
          git -C lib/chibios checkout -q FETCH_HEAD
          git -C lib/chibios-contrib fetch --depth 1 origin 9d7a7f904ed135e3459cf6d602db56a26872df6b
          git -C lib/chibios-contrib checkout -q FETCH_HEAD

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi python3-pip >/dev/null
          pip3 install -q qmk || pip3 install -q --break-system-packages qmk

      - name: Build
        run: qmk compile -kb czmao/ds17/r6 -km via -e COLOR=false

      - name: Collect
        run: |
          mkdir -p out
          cp -v .build/*.bin out/
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ds17-r6-via
          path: out/
          if-no-files-found: error
