name: Build DS17 R6 VIA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout keyboard source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Fetch official QMK and drop in the board
        run: |
          git clone --depth 1 https://github.com/qmk/qmk_firmware.git qmk
          cd qmk
          git submodule update --init --depth 1 lib/chibios lib/chibios-contrib lib/lufa lib/printf lib/vusb
          rm -rf keyboards/czmao
          cp -r ../src/keyboards/czmao keyboards/czmao
          rm -rf keyboards/czmao/ds17/ds17r6_uf2

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi python3-pip >/dev/null
          pip3 install -q qmk || pip3 install -q --break-system-packages qmk

      - name: Build
        working-directory: qmk
        run: qmk compile -kb czmao/ds17/r6 -km via

      - name: Collect
        run: |
          mkdir -p out
          cp -v qmk/.build/*.bin out/
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ds17-r6-via
          path: out/
          if-no-files-found: error
